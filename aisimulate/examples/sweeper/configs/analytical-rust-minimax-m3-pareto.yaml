# Table-free ANALYTICAL validation sweep through Dynamo's Rust AIC callback.
search_space:
  deployment_mode: [agg]
  backend: [sglang]
  parallel_configs:
    - {tp: 8, pp: 1, attention_dp: 1, moe_tp: 1, moe_ep: 8, replicas: 1}

  model_name: MiniMaxAI/MiniMax-M3
  hardware_sku: b200_sxm
  gpu_budget: 8
  min_gpu_budget: 8
  context_length: 2048
  database_mode: ANALYTICAL
  analytical_config:
    level: standard
    communication_mode: empirical
  aic_gemm_dtype: fp8
  aic_moe_dtype: fp8_block
  aic_fmha_dtype: bfloat16
  aic_kv_cache_dtype: bfloat16
  aic_comm_dtype: half

  agg_max_num_batched_tokens: [8192, 16384]
  agg_max_num_seqs: [256, 512]

workload:
  isl: 1024
  osl: 64
  kv_load_ratio: [0.0012, 0.0048]
  num_request_ratio: 1.5

goal:
  target: pareto
  pareto_objectives: [throughput_per_gpu, throughput_per_user]

sweep:
  max_rounds: 2
  parallel_evals: 1
  candidates_per_round: 4
  max_eval_seconds: 180
